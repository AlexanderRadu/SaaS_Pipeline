openapi: 3.0.3
info:
  title: SaaS-конвейер API (Асинхронная версия)
  version: 1.0.0
servers:
  - url: /
    description: API Gateway

security:
  - BearerAuth: [ ]

paths:
  /api/v1/auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [ Auth ]
      security: [ ]
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Пользователь создан
        '400':
          description: Ошибка валидации
        '409':
          description: Пользователь с таким email уже существует

  /api/v1/auth/login:
    post:
      summary: Авторизация и получение токена
      tags: [ Auth ]
      security: [ ]
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверный email или пароль

  /api/v1/instances:
    get:
      summary: Список запущенных сервисов пользователя
      tags: [ Status ]
      description: Возвращает список всех инстансов текущего пользователя.
      operationId: listUserInstances
      responses:
        '200':
          description: Список инстансов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceInfo'

  /v1/catalog:
    get:
      summary: Получить каталог доступных шаблонов
      tags: [ Catalog ]
      operationId: getCatalog
      responses:
        '200':
          description: Успешный ответ с каталогом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'


  /v1/service_instances/{instance_id}:
    put:
      summary: Асинхронное развертывание
      tags: [ Deploy ]
      description: Инициирует запуск контейнера и возвращает operation_id для отслеживания статуса.
      operationId: provisionInstance
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '202':
          description: Запрос принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Асинхронное удаление сервиса
      tags: [ Deploy ]
      description: Инициирует остановку и удаление контейнера. Возвращает operation_id.
      operationId: deprovisionInstance
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '202':
          description: Запрос на удаление принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '410':
          description: Сервис уже удален или не существует


  /api/v1/operations/{operation_id}:
    get:
      summary: Получить статус асинхронной операции
      tags: [ Operations ]
      description: Клиент должен опрашивать этот метод (например, раз в 5 секунд), пока статус не станет succeeded или failed.
      operationId: getOperationStatus
      parameters:
        - name: operation_id
          in: path
          required: true
          description: ID операции, полученный при PUT/DELETE запросе
          schema:
            type: string
      responses:
        '200':
          description: Текущий статус операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '404':
          description: Операция не найдена

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    InstanceId:
      name: instance_id
      in: path
      required: true
      description: ID инстанса, генерируется клиентом при создании.
      schema:
        type: string

  schemas:
    AuthRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer токен

    InstanceInfo:
      type: object
      properties:
        id:
          type: string
        service_name:
          type: string
          example: "Ubuntu"
        status:
          type: string
          enum: [ provisioning, running, deprovisioning, failed, deleted ]
        connection_url:
          type: string
          nullable: true
          example: "ssh://192.168.1.10:30022"

    Catalog:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'

    Service:
      type: object
      required: [ id, name, description ]
      properties:
        id:
          type: string
          example: "uuid-ubuntu"
        name:
          type: string
          example: "Ubuntu"
        description:
          type: string
        docker_image:
          type: string
          description: Внутреннее поле
          example: "ubuntu:latest"

    ProvisionRequest:
      type: object
      required: [ service_id ]
      properties:
        service_id:
          type: string
          example: "uuid-ubuntu"


    OperationResponse:
      type: object
      description: Краткий ответ при инициации задачи
      properties:
        operation_id:
          type: string
          example: "op-12345-abcde"
        status:
          type: string
          enum: [ in_progress ]
          example: "in_progress"

    OperationStatus:
      type: object
      description: Полный статус задачи (возвращается при опросе)
      properties:
        operation_id:
          type: string
          example: "op-12345-abcde"
        status:
          type: string
          enum: [ in_progress, succeeded, failed ]
          example: "succeeded"
        result:
          type: object
          nullable: true
          description: Результат выполнения (например, доступы). Присутствует только при status=succeeded.
          properties:
            connection_details:
              type: object
              properties:
                url:
                  type: string
                username:
                  type: string
                password:
                  type: string
        error:
          type: string
          nullable: true
          example: "Timeout pulling docker image"

    Error:
      type: object
      properties:
        error:
          type: string
        description:
          type: string