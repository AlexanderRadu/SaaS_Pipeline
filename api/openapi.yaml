openapi: 3.0.3
info:
  title: PILOT - Pipeline Orchestration Tool (OSB API Compliant)
  version: 1.0.0
servers:
  - url: /
    description: Asynchronous API for managing services

security:
  - BearerAuth: [ ]

paths:
  /api/v2/auth/register:
    post:
      description: New user registration
      tags: [ Auth ]
      security: [ ]
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Bad request
        '409':
          description: Conflict

  /api/v2/auth/login:
    post:
      description: Authorization and token retrieval
      tags: [ Auth ]
      security: [ ]
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized

  /api/v2/catalog:
    get:
      description: Catalog of available services
      tags: [ Catalog ]
      operationId: getCatalog
      parameters:
        - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          description: Unauthorized

  /api/v2/instances:
    get:
      description: List of currently working user's instances
      tags: [ Status ]
      operationId: listUserInstances
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstanceInfo'
        '401':
          description: Unauthorized

  /api/v2/service_instances/{instance_id}:
    get:
      description: Info about a specific service instance
      tags: [ Status ]
      operationId: getInstanceInfo
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        '401':
          description: Unauthorized
        '404':
          description: Not found

    put:
      description: Provision a new service instance
      tags: [ Deploy ]
      operationId: provisionInstance
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/AcceptsIncomplete'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '200':
          description: OK (Already exists with identical parameters)
        '201':
          description: Created synchronously
        '202':
          description: Accepted (Asynchronous execution started)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Bad request (async required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

    patch:
      description: Update a service instance
      tags: [ Deploy ]
      operationId: updateInstance
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/AcceptsIncomplete'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '200':
          description: Synchronously updated
        '202':
          description: Accepted (Asynchronous execution started)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '422':
          description: Unprocessable Entity (Update not supported)

    delete:
      description: Deprovision a service instance
      tags: [ Deploy ]
      operationId: deprovisionInstance
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/AcceptsIncomplete'
        - name: service_id
          in: query
          required: true
          schema:
            type: string
        - name: plan_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Synchronously deleted
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Bad request (async required)
        '401':
          description: Unauthorized
        '410':
          description: Gone

  /api/v2/service_instances/{instance_id}/last_operation:
    get:
      description: Get last asynchronous operation status for instance
      tags: [ Status ]
      operationId: listLastAsyncOperationStatus
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - name: service_id
          in: query
          description: ID of the service
          schema:
            type: string
        - name: plan_id
          in: query
          description: ID of the plan
          schema:
            type: string
        - name: operation
          in: query
          description: The operation ID returned by the broker during provision/deprovision
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/v2/service_instances/{instance_id}/service_bindings/{binding_id}:
    put:
      description: Create a service binding
      tags: [ Bindings ]
      operationId: createServiceBinding
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/BindingId'
        - $ref: '#/components/parameters/AcceptsIncomplete'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceBindingRequest'
      responses:
        '201':
          description: Created (Synchronous)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceBindingResponse'
        '202':
          description: Accepted (Asynchronous)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Bad request (async required)
        '401':
          description: Unauthorized

    delete:
      description: Delete a service binding
      tags: [ Bindings ]
      operationId: deleteServiceBinding
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/BindingId'
        - $ref: '#/components/parameters/AcceptsIncomplete'
        - name: service_id
          in: query
          required: true
          schema:
            type: string
        - name: plan_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (Synchronous)
        '202':
          description: Accepted (Asynchronous)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: Bad request (async required)
        '401':
          description: Unauthorized
        '410':
          description: Gone

  /api/v2/service_instances/{instance_id}/service_bindings/{binding_id}/last_operation:
    get:
      description: Get last asynchronous operation status for a binding
      tags: [ Bindings ]
      operationId: getBindingLastOperationStatus
      parameters:
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/BindingId'
        - name: service_id
          in: query
          schema:
            type: string
        - name: plan_id
          in: query
          schema:
            type: string
        - name: operation
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    APIVersion:
      name: X-Broker-API-Version
      in: header
      description: Version number of the Service Broker API that the Platform will use
      required: true
      schema:
        type: string
        default: '2.16'
    InstanceId:
      name: instance_id
      in: path
      required: true
      description: UUID of the service instance
      schema:
        type: string
    BindingId:
      name: binding_id
      in: path
      required: true
      description: UUID of the binding
      schema:
        type: string
    AcceptsIncomplete:
      name: accepts_incomplete
      in: query
      required: false
      description: Flag to allow asynchronous processing
      schema:
        type: boolean

  schemas:
    AuthRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    TokenResponse:
      type: object
      properties:
        token:
          type: string

    InstanceInfo:
      type: object
      properties:
        id:
          type: string
        service_id:
          type: string
        plan_id:
          type: string
        status:
          type: string
          enum: [ provisioning, running, deprovisioning, failed, deleted ]
        connection_url:
          type: string
          nullable: true

    Catalog:
      type: object
      required: [ services ]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'

    Service:
      type: object
      required: [ id, name, description, bindable, plans ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        bindable:
          type: boolean
          description: Specifies whether service bindings can be created.
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'

    Plan:
      type: object
      required: [ id, name, description ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    ProvisionRequest:
      type: object
      required: [ service_id, plan_id ]
      properties:
        service_id:
          type: string
        plan_id:
          type: string
        context:
          type: object
          description: Platform-specific contextual information under which the service instance is to be provisioned.
        organization_guid:
          type: string
        space_guid:
          type: string
        parameters:
          type: object

    ServiceBindingRequest:
      type: object
      required: [ service_id, plan_id ]
      properties:
        service_id:
          type: string
        plan_id:
          type: string
        bind_resource:
          type: object
          description: The resource to be bound to the service instance.
        parameters:
          type: object
          nullable: true

    ServiceBindingResponse:
      type: object
      properties:
        credentials:
          type: object
          additionalProperties: true

    OperationResponse:
      type: object
      properties:
        description:
          type: string
        operation:
          type: string
          description: The operation ID for tracking progress via /last_operation
          example: "op-12345"

    OperationStatus:
      type: object
      required: [ state ]
      properties:
        state:
          type: string
          enum: [ in progress, succeeded, failed ]
          example: "succeeded"
        description:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string
        description:
          type: string