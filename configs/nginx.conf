events {}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include mime.types;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://api-gateway:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_intercept_errors on;
        }

        error_page 404 /404_error;
        location = /404_error {
            internal;
            default_type application/json;
            return 404 '{"error":"Not Found","message":"The requested resource does not exist"}';
        }

        error_page 502 /502_error;
        location = /502_error {
            internal;
            default_type application/json;
            return 502 '{"error":"Bad Gateway","message":"Backend is unreachable or returned invalid response"}';
        }

        error_page 504 /504_error;
        location = /504_error {
            internal;
            default_type application/json;
            return 504 '{"error":"Gateway Timeout","message":"Backend did not respond in time"}';
        }
        error_page 500 503 /50x_error;
        location = /50x_error {
            internal;
            default_type application/json;
            return 500 '{"error":"Internal Server Error","message":"Unexpected error occurred"}';
        }
    }
}