events {
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include mime.types;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    server {
        listen 80;
        server_name localhost;

        limit_req_status 429;

        location / {

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With, X-Request-Id' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }


            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With, X-Request-Id' always;

            add_header 'Access-Control-Expose-Headers' 'X-Request-Id' always;


            limit_req zone=api_limit burst=20 nodelay;



            proxy_pass http://api-gateway:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_intercept_errors on;
        }

        location /api/v2/auth {
            limit_req zone=auth_limit burst=5 nodelay;


            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With, X-Request-Id' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }




            proxy_pass http://api-gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id "";
            proxy_intercept_errors on;
        }


        error_page 404 /404_error;
        location = /404_error {
            internal;
            default_type application/json;
            return 404 '{"error":"Not Found","message":"The requested resource does not exist"}';
        }

        error_page 429 /429_error;
        location = /429_error {
            internal;
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded, please slow down"}';
        }

        error_page 502 /502_error;
        location = /502_error {
            internal;
            default_type application/json;
            return 502 '{"error":"Bad Gateway","message":"Backend is unreachable or returned invalid response"}';
        }

        error_page 504 /504_error;
        location = /504_error {
            internal;
            default_type application/json;
            return 504 '{"error":"Gateway Timeout","message":"Backend did not respond in time"}';
        }

        error_page 500 503 /50x_error;
        location = /50x_error {
            internal;
            default_type application/json;
            return 500 '{"error":"Internal Server Error","message":"Unexpected error occurred"}';
        }
    }
}