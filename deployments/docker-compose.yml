services:
  auth_db:
    image: postgres:17-alpine
    container_name: auth_db
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  status_db:
    image: postgres:17-alpine
    container_name: status_db
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${STATUS_DB_USER}
      POSTGRES_PASSWORD: ${STATUS_DB_PASSWORD}
      POSTGRES_DB: ${STATUS_DB_NAME}
    volumes:
      - status_db_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog_db:
    image: postgres:17-alpine
    container_name: catalog_db
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: ${CATALOG_DB_NAME}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10


  auth-migrate:
    build:
      context: ../
      dockerfile: deployments/migrate.Dockerfile
    env_file:
      - ../.env
    environment:
      AUTH_DB_USER: postgres
      AUTH_DB_NAME: auth_db
      DATABASE_URL: postgres://postgres:${AUTH_DB_PASSWORD}@auth_db:5432/auth_db?sslmode=disable
      SERVICE_NAME: ${AUTH_SERVICE_NAME}
    networks:
      - network
    depends_on:
      auth_db:
        condition: service_healthy

  status-migrate:
    build:
      context: ../
      dockerfile: deployments/migrate.Dockerfile
    env_file:
      - ../.env
    environment:
      STATUS_DB_USER: postgres
      DATABASE_URL: postgres://postgres:${STATUS_DB_PASSWORD}@status_db:5432/status_db?sslmode=disable
      SERVICE_NAME: ${STATUS_SERVICE_NAME}
    networks:
      - network
    depends_on:
      status_db:
        condition: service_healthy

  catalog-migrate:
    build:
      context: ../
      dockerfile: deployments/migrate.Dockerfile
    env_file:
      - ../.env
    environment:
      CATALOG_DB_USER: postgres
      CATALOG_DB_NAME: catalog_db
      DATABASE_URL: postgres://postgres:${CATALOG_DB_PASSWORD}@catalog_db:5432/catalog_db?sslmode=disable
      SERVICE_NAME: ${CATALOG_SERVICE_NAME}
    networks:
      - network
    depends_on:
      catalog_db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    networks:
      - network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    env_file:
      - ../.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ../configs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - network
    depends_on:
      - api-gateway


  auth-service:
    container_name: auth-service
    build:
      context: ../
      dockerfile: deployments/auth.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
    networks:
      - network
    depends_on:
      auth_db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully

  catalog-service:
    container_name: catalog-service
    build:
      context: ../
      dockerfile: deployments/catalog.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL}
    networks:
      - network
    depends_on:
      catalog_db:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  status-service:
    container_name: status-service
    build:
      context: ../
      dockerfile: deployments/status.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${STATUS_DATABASE_URL}
    networks:
      - network
    depends_on:
      status_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      status-migrate:
        condition: service_completed_successfully

  deploy-service:
    container_name: deploy-service
    build:
      context: ../
      dockerfile: deployments/deploy.Dockerfile
    env_file:
      - ../.env
    networks:
      - network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      status-service:
        condition: service_started
      catalog-service:
        condition: service_started

  api-gateway:
    container_name: api-gateway
    build:
      context: ../
      dockerfile: deployments/api-gateway.Dockerfile
    env_file:
      - ../.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8080
      - DEPLOY_SERVICE_URL=http://deploy-service:8080
      - STATUS_SERVICE_URL=http://status-service:8080
      - CATALOG_SERVICE_URL=http://catalog-service:8080
    networks:
      - network
    depends_on:
      - auth-service
      - catalog-service
      - status-service
      - deploy-service

networks:
  network:
    driver: bridge

volumes:
  auth_db_data:
  status_db_data:
  catalog_db_data:
  rabbitmq_data:
  redis_data: