services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
        context: ../
        dockerfile: deployments/migrate.Dockerfile
    env_file:
      - ../.env
    networks:
        - network
    depends_on:
      db:
        condition: service_healthy



  redis:
    image: redis:7-alpine
    container_name: redis_cache
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10



  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    env_file:
      - ../.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5


  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ../configs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - network


  auth-service:
    container_name: auth-service
    build:
      context: ../
      dockerfile: deployments/auth.Dockerfile
    env_file:
      - ../.env
    ports:
      - "8081:8080"
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  catalog-service:
    container_name: catalog-service
    build:
      context: ../
      dockerfile: deployments/catalog.Dockerfile
    env_file:
      - ../.env
    ports:
      - "4040:4040"
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  status-service:
    container_name: status-service
    build:
      context: ../
      dockerfile: deployments/status.Dockerfile
    env_file:
      - ../.env
    ports:
      - "5050:5050"
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data: