services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
        context: ../
        dockerfile: deployments/migrate.Dockerfile
    env_file:
      - ../.env
    networks:
        - network
    depends_on:
      db:
        condition: service_healthy



  redis:
    image: redis:7-alpine
    container_name: redis_cache
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10



  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    env_file:
      - ../.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5


  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ../configs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - network
    depends_on:
      - api-gateway


  auth-service:
    container_name: auth-service
    build:
      context: ../
      dockerfile: deployments/auth.Dockerfile
    env_file:
      - ../.env
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  catalog-service:
    container_name: catalog-service
    build:
      context: ../
      dockerfile: deployments/catalog.Dockerfile
    env_file:
      - ../.env
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  status-service:
    container_name: status-service
    build:
      context: ../
      dockerfile: deployments/status.Dockerfile
    env_file:
      - ../.env
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  deploy-service:
    container_name: deploy-service
    build:
      context: ../
      dockerfile: deployments/deploy.Dockerfile
    env_file:
      - ../.env
    networks:
      - network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      status-service:
        condition: service_started
      catalog-service:
        condition: service_started

  api-gateway:
    container_name: api-gateway
    build:
      context: ../
      dockerfile: deployments/api-gateway.Dockerfile
    env_file:
      - ../.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8080
      - DEPLOY_SERVICE_URL=http://deploy-service:8080
      - STATUS_SERVICE_URL=http://status-service:8080
      - CATALOG_SERVICE_URL=http://catalog-service:8080
    networks:
      - network
    depends_on:
      - auth-service
      - catalog-service
      - status-service
      - deploy-service


networks:
  network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: